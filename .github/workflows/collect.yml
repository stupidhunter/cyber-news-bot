name: Thu thập tin tức an ninh mạng

on:
  schedule:
    # Mỗi 4 giờ (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 theo giờ UTC).
    # Muốn đổi giờ, sửa dòng cron này (https://crontab.guru).
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # cho phép chạy tay từ tab Actions

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài dependencies
        run: pip install -r requirements.txt

      - name: Thu thập + gửi Telegram + sinh trang web
        run: python run.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Dịch tiêu đề tiếng Anh -> tiếng Việt (0 để tắt)
          TRANSLATE: "1"
          TRANSLATE_MAX: "60"

      - name: Commit dữ liệu + trang web
        # if: always() — kể cả khi Telegram lỗi (token sai chẳng hạn),
        # dữ liệu đã thu thập vẫn được commit để không mất lịch sử.
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: cập nhật tin tức (run ${{ github.run_number }})"
          file_pattern: data/ docs/
